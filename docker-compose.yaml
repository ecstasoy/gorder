x-common-env: &common-env
  CONFIG_DIR: /app/config
  CONSUL_ADDR: consul:8500
  JAEGER_URL: http://jaeger:14268/api/traces
  RABBITMQ_HOST: rabbit-mq
  REDIS_LOCAL_IP: redis
  LOG_LEVEL: info

services:
  consul:
    image: hashicorp/consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbit-mq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14268:14268"
      - "4318:4318"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  order-mongo:
    image: "mongo:7.0.8"
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-express:
    image: "mongo-express"
    restart: always
    ports:
      - "8092:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://root:password@order-mongo:27017/
      ME_CONFIG_BASICAUTH: false

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9093:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus

  redis:
    image: redis:latest
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf

  mysql:
    image: mysql
    restart: on-failure
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - TZ=UTC
    command: --default-time-zone='+00:00'
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------- application services ----------

  stock:
    build:
      context: .
      args:
        SERVICE: stock
    image: gorder-stock:dev
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_started

    environment:
      <<: *common-env
      STOCK_GRPC_ADDR: ":5003"
      STOCK_GRPC_REGISTER_ADDR: "stock:5003"
      STOCK_HTTP_ADDR: "0.0.0.0:9091"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      STRIPE_KEY: ${STRIPE_KEY}
    ports:
      - "9091:9091"

  order:
    build:
      context: .
      args:
        SERVICE: order
    image: gorder-order:dev
    restart: on-failure
    depends_on:
      order-mongo:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
      consul:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started
      stock:
        condition: service_started
    environment:
      <<: *common-env
      ORDER_HTTP_ADDR: "0.0.0.0:9090"
      ORDER_GRPC_ADDR: ":5002"
      ORDER_GRPC_REGISTER_ADDR: "order:5002"
      MONGO_HOST: order-mongo
      REDIS_LOCAL_IP: redis
    ports:
      - "9090:9090"

  payment:
    build:
      context: .
      args:
        SERVICE: payment
    image: gorder-payment:dev
    restart: on-failure
    depends_on:
      rabbit-mq:
        condition: service_healthy
      consul:
        condition: service_healthy
      jaeger:
        condition: service_started
      order:
        condition: service_started
    environment:
      <<: *common-env
      PAYMENT_HTTP_ADDR: "0.0.0.0:9092"
      PAYMENT_PROCESSOR: "mem"
    ports:
      - "9092:9092"

  kitchen:
    build:
      context: .
      args:
        SERVICE: kitchen
    image: gorder-kitchen:dev
    restart: on-failure
    depends_on:
      rabbit-mq:
        condition: service_healthy
      consul:
        condition: service_healthy
      jaeger:
        condition: service_started
      order:
        condition: service_started
    environment:
      <<: *common-env
      KITCHEN_HTTP_ADDR: "0.0.0.0:9094"
    ports:
      - "9094:9094"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen
  namespace: gorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitchen
  template:
    metadata:
      labels:
        app: kitchen
    spec:
      containers:
        - name: kitchen
          image: gorder-kitchen:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_DIR
              value: /app/config
            - name: CONSUL_ADDR
              value: consul:8500
            - name: JAEGER_URL
              value: http://jaeger:14268/api/traces
            - name: RABBITMQ_HOST
              value: rabbit-mq
            - name: LOG_LEVEL
              value: info
            - name: KITCHEN_HTTP_ADDR
              value: "0.0.0.0:9094"
          ports:
            - name: admin
              containerPort: 9094
          volumeMounts:
            - name: config
              mountPath: /app/config/global.yaml
              subPath: global.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9094
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 9094
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
      volumes:
        - name: config
          configMap:
            name: gorder-config
---
apiVersion: v1
kind: Service
metadata:
  name: kitchen
  namespace: gorder
spec:
  type: NodePort
  selector:
    app: kitchen
  ports:
    - name: admin
      port: 9094
      targetPort: 9094
      nodePort: 30094

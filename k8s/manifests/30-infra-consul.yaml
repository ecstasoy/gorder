apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: gorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.20
          args:
            - "agent"
            - "-server"
            - "-ui"
            - "-node=server-1"
            - "-bootstrap-expect=1"
            - "-client=0.0.0.0"
          ports:
            - name: http
              containerPort: 8500
            - name: dns
              containerPort: 8600
              protocol: UDP
          readinessProbe:
            exec:
              command: ["consul", "members"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: gorder
spec:
  type: NodePort
  selector:
    app: consul
  ports:
    - name: http
      port: 8500
      targetPort: 8500
      nodePort: 30500
    - name: dns
      port: 8600
      targetPort: 8600
      protocol: UDP

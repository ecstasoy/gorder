apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-mq
  namespace: gorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbit-mq
  template:
    metadata:
      labels:
        app: rabbit-mq
    spec:
      containers:
        - name: rabbit-mq
          image: rabbitmq:3-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: mgmt
              containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits:   { memory: "1Gi",   cpu: "1000m" }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbit-mq
  namespace: gorder
spec:
  type: ClusterIP
  selector:
    app: rabbit-mq
  ports:
    - name: amqp
      port: 5672
    - name: mgmt
      port: 15672

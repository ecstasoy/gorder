apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: gorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: gorder-payment:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_DIR
              value: /app/config
            - name: CONSUL_ADDR
              value: consul:8500
            - name: JAEGER_URL
              value: http://jaeger:14268/api/traces
            - name: RABBITMQ_HOST
              value: rabbit-mq
            - name: LOG_LEVEL
              value: info
            - name: PAYMENT_HTTP_ADDR
              value: "0.0.0.0:9092"
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe
                  key: STRIPE_KEY
                  optional: true
            - name: ENDPOINT_STRIPE_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe
                  key: ENDPOINT_STRIPE_SECRET
                  optional: true
          ports:
            - name: http
              containerPort: 9092
          volumeMounts:
            - name: config
              mountPath: /app/config/global.yaml
              subPath: global.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
      volumes:
        - name: config
          configMap:
            name: gorder-config
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: gorder
spec:
  type: NodePort
  selector:
    app: payment
  ports:
    - name: http
      port: 9092
      targetPort: 9092
      nodePort: 30092

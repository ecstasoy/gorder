global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'order-service'
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['order:9090']

  - job_name: 'stock-service'
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['stock:9091']

  - job_name: 'payment-service'
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['payment:9092']

  - job_name: 'kitchen-service'
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['kitchen:9094']